[project]
name = "materialized-enhancements"
version = "0.2.7"
description = "Materialized Enhancements — an art+tech hackathon project exploring gene enhancements as generative art"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "reflex==0.9.7",
  "reflex-components-radix==0.9.6",
  "granian>=2.7.9",
  "polars>=1.43.0",
  "pydantic>=2.13.4",
  "enhancement-geometry>=0.2.4",
  "dotenv>=0.9.9",
  "pillow>=12.3.0",
  "fast-simplification>=0.1.13",
  "networkx>=3.6.1",
  "reflex-mui-datagrid>=0.3.13",
  "uvicorn>=0.51.0",
  "gunicorn>=26.0.0",
]

[project.scripts]
start = "materialized_enhancements.run:main"
serve = "materialized_enhancements.run:serve"
preselect = "materialized_enhancements.run:preselect"
resolve-proteins = "materialized_enhancements.resolve_proteins:main"
download-structures = "materialized_enhancements.resolve_proteins:download_main"
stl = "materialized_enhancements.generate_stl:main"
kill-ports = "materialized_enhancements.run:kill_ports"

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "matplotlib>=3.10.8",
  "pytest>=9.0.2",
  "ruff>=0.9.0",
]
